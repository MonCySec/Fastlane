<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FastLane | Confidently Fast</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--navy:#14213d;--navy2:#1f2f52;--silver:#c9d1dc;--mist:#eef1f6;--gold:#c8923a;--ink:#1a2236;--ok:#1f7a4d;--bad:#b3261e;--warn:#9a6700;--r:6px}
*{box-sizing:border-box}
body{margin:0;font:15px/1.55 'IBM Plex Sans',system-ui,sans-serif;color:var(--ink);background:var(--mist)}
h1,h2,h3{font-family:Archivo,sans-serif;margin:0 0 .5rem;line-height:1.15}
h1{font-size:clamp(1.8rem,4vw,2.8rem);font-weight:800;font-style:italic;letter-spacing:-.02em}
h2{font-size:1.35rem;font-weight:700}h3{font-size:1.05rem;font-weight:700}
header{background:var(--navy);color:#fff;padding:.75rem 1.25rem;display:flex;gap:1rem;align-items:center;flex-wrap:wrap;border-bottom:3px solid var(--gold)}
.brand{font:800 1.25rem Archivo;font-style:italic;margin-right:auto}.brand small{display:block;font:400 .7rem 'IBM Plex Sans';font-style:normal;color:var(--silver)}
nav{display:flex;gap:.25rem;flex-wrap:wrap}
nav button{background:none;border:0;color:var(--silver);padding:.45rem .8rem;border-radius:var(--r);cursor:pointer;font:500 .9rem inherit}
nav button.on,nav button:hover{background:var(--navy2);color:#fff}
main{max-width:1050px;margin:0 auto;padding:1.25rem}
.card{background:#fff;border:1px solid var(--silver);border-radius:var(--r);padding:1.1rem;margin-bottom:1rem}
.hero{background:var(--navy);color:#fff;border-radius:var(--r);padding:1.5rem;margin-bottom:1rem;background-image:repeating-linear-gradient(100deg,transparent 0 22px,rgba(201,209,220,.07) 22px 24px)}
.hero p{color:var(--silver);max-width:60ch;margin:.25rem 0 0}
label{display:block;font-weight:500;font-size:.85rem;margin:.6rem 0 .2rem}
input,select,textarea{width:100%;padding:.55rem .65rem;border:1px solid #9aa6b8;border-radius:var(--r);font:inherit;background:#fff}
input:focus,select:focus,button:focus-visible,textarea:focus{outline:2px solid var(--gold);outline-offset:1px}
.g{display:grid;gap:.75rem;grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}
.btn{background:var(--navy);color:#fff;border:0;padding:.6rem 1.1rem;border-radius:var(--r);font:600 .9rem inherit;cursor:pointer;margin:.6rem .4rem 0 0}
.btn.gold{background:var(--gold);color:#1a1205}.btn.line{background:#fff;color:var(--navy);border:1px solid var(--navy)}.btn.sm{padding:.3rem .7rem;margin:.2rem .3rem 0 0;font-size:.8rem}
.btn:disabled{opacity:.45;cursor:not-allowed}
table{width:100%;border-collapse:collapse;font-size:.88rem}th,td{text-align:left;padding:.5rem;border-bottom:1px solid #e2e7ef;vertical-align:top}th{background:var(--mist)}
.wrap{overflow-x:auto}
.b{display:inline-block;padding:.1rem .55rem;border-radius:99px;font-size:.75rem;font-weight:600;background:#e4e9f1}
.b.ok{background:#d9f0e4;color:var(--ok)}.b.bad{background:#fbe0de;color:var(--bad)}.b.warn{background:#fdf0cf;color:var(--warn)}
.muted{color:#5a6578;font-size:.85rem}.row{display:flex;gap:.5rem;align-items:end;flex-wrap:wrap}
.drv{display:grid;gap:.5rem;grid-template-columns:1.4fr 1fr 1.2fr auto;align-items:end;margin-bottom:.4rem}
.drv label{margin-top:0}
.track{display:flex;gap:.25rem;margin:.6rem 0;flex-wrap:wrap}.track span{flex:1;min-width:92px;font-size:.72rem;padding:.35rem;border-radius:4px;background:#e4e9f1;text-align:center}.track span.d{background:var(--navy);color:#fff}.track span.c{background:var(--gold);color:#1a1205;font-weight:600}
.tot{font:800 1.8rem Archivo}
.toast{position:fixed;bottom:1rem;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:.7rem 1.1rem;border-radius:var(--r);z-index:9;max-width:90vw}
.demo button{margin:.2rem .3rem 0 0}
.modal{position:fixed;inset:0;background:rgba(20,33,61,.75);display:flex;align-items:center;justify-content:center;z-index:20;padding:1rem}.mbox{background:#fff;border-radius:var(--r);padding:1rem;max-width:min(900px,100%);width:100%;max-height:92vh;display:flex;flex-direction:column;gap:.5rem}.mbox img{max-width:100%;max-height:78vh;object-fit:contain;margin:auto}.mbox iframe{width:100%;height:78vh;border:0}
@media(max-width:640px){.drv{grid-template-columns:1fr 1fr}}
@media(prefers-reduced-motion:no-preference){.toast{animation:up .25s}}@keyframes up{from{opacity:0;transform:translate(-50%,8px)}}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body>
<div id="root"></div>
<script>
/* ===== FastLane prototype: data layer (localStorage; swap for Firebase/Supabase behind these functions) ===== */
const K='fastlane_v1',$=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const peso=n=>'₱'+Math.round(n).toLocaleString('en-PH');
const now=()=>new Date().toISOString();
const when=s=>s?new Date(s).toLocaleString('en-PH',{timeZone:'Asia/Manila',dateStyle:'medium',timeStyle:'short'}):'-';
const hrs=(a,b)=>(new Date(b)-new Date(a))/36e5;
const sha=async p=>[...new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(p)))].map(b=>b.toString(16).padStart(2,'0')).join('');
const uid=p=>p+'-'+Math.random().toString(36).slice(2,8).toUpperCase();
const STAGES=['Filed','Acknowledged','Inspection Scheduled','Inspection Completed','Settlement Offered','Settlement Accepted','Paid / Closed'];
const REASONS=['Image unreadable','Wrong document','Missing page','Expired document','Details do not match application'];
let db,me=null,tab='',uwOpen=null,lastQuote=null,rows=1,toastT;
async function boot(){
  db=JSON.parse(localStorage.getItem(K)||'null');
  if(!db){
    const pw=await sha('demo1234'),u=(email,name,role)=>({email,name,role,pw});
    db={users:[u('customer@demo.ph','Demo Customer','Customer'),u('uw@demo.ph','Una Underwriter','Underwriter'),u('claims@demo.ph','Carlo Claims','Claims Officer'),u('claims2@demo.ph','Cathy Claims','Claims Officer'),u('csr@demo.ph','Sam Service','Customer Service'),u('admin@demo.ph','Ada Admin','Administrator')],
    lto:[
     {l:'N01-23-000001',n:'Juan Dela Cruz',d:'1990-05-14',s:'Valid',v:[]},
     {l:'N02-21-000002',n:'Maria Dela Cruz',d:'1992-08-02',s:'Valid',v:[{c:'Illegal parking',sev:'minor',dt:'2025-06-10'}]},
     {l:'N03-19-000003',n:'Pedro Santos',d:'1985-01-20',s:'Valid',v:[{c:'Reckless driving',sev:'major',dt:'2024-02-11'},{c:'Beating the red light',sev:'major',dt:'2025-01-05'},{c:'Drunk driving',sev:'major',dt:'2025-09-18'}]},
     {l:'N04-22-000004',n:'Ana Reyes',d:'1998-11-30',s:'Valid',v:[]},
     {l:'N05-18-000005',n:'Luis Garcia',d:'1978-03-09',s:'Suspended',v:[{c:'Reckless driving',sev:'major',dt:'2025-04-02'}]},
     {l:'N06-20-000006',n:'Carla Mendoza',d:'2001-07-17',s:'Valid',v:[]}],
    vig:[{g:'Economy',max:800000,base:18000},{g:'Standard',max:2000000,base:28000},{g:'Performance',max:1e12,base:45000}],
    shops:['AutoFix Makati','RapidRepair Pasig','Metro Body Works'],
    quotes:[],apps:[],policies:[],payments:[],claims:[],notifs:[],audit:[]};
    save();
  }
}
const save=()=>localStorage.setItem(K,JSON.stringify(db));
const log=a=>{db.audit.unshift({u:me?.email||'system',a,t:now()});save()};
const notify=(to,m)=>{db.notifs.unshift({to,m,t:now()});save()};
const toast=m=>{clearTimeout(toastT);let t=$('.toast');if(!t){t=document.createElement('div');t.className='toast';t.setAttribute('role','status');document.body.append(t)}t.textContent=m;toastT=setTimeout(()=>t.remove(),3500)};

/* ===== Business rules ===== */
const ltoFind=l=>db.lto.find(r=>r.l===l.trim().toUpperCase());
/* Unknown license: auto-generate a random driving background that matches the declared name and birthdate, and save it so the result stays the same */
function ltoEnsure(d){
  let r=ltoFind(d.l);if(r)return r;
  const P=['Illegal parking','Speeding','Disregarding traffic signs','Reckless driving','Beating the red light','Drunk driving'],M=['Reckless driving','Beating the red light','Drunk driving'];
  const k=Math.random()<.5?0:Math.floor(Math.random()*5);
  const v=Array.from({length:k},()=>{const c=P[Math.floor(Math.random()*P.length)];return{c,sev:M.includes(c)?'major':'minor',dt:new Date(Date.now()-Math.random()*5*365*864e5).toISOString().slice(0,10)}});
  r={l:d.l.trim().toUpperCase(),n:d.n.trim(),d:d.d,s:'Valid',v,gen:true};
  db.lto.push(r);save();return r;
}
function calc(f){
  const v=db.vig.find(x=>f.value<=x.max),n=f.drivers.length,mult=f.cover==='Comprehensive'?1:.45;
  const ds=f.drivers.map((d,i)=>{
    const r=f.manual?ltoFind(d.l):ltoEnsure(d);let st='Verified',note='',load=0,excl=false;
    if(!r){st='Not Found';note='No LTO record found. Needs a manual check by an underwriter'}
    else if(r.n.toLowerCase()!==d.n.trim().toLowerCase()||r.d!==d.d){st='Discrepancy';note='Name or birthdate does not match the LTO record'}
    else if(r.s!=='Valid'){if(i===0){st='Discrepancy';note='Suspended license cannot be the primary driver'}else{excl=true;note='Suspended: listed as excluded driver'}}
    if(r&&!excl){const lim=new Date();lim.setFullYear(lim.getFullYear()-3);const maj=r.v.filter(x=>x.sev==='major'&&new Date(x.dt)>=lim).length;load=maj>=3?.3:maj*.05}
    const tr=v.base/n*mult,amt=excl?0:tr*(1+load);
    return{...d,st,note,load,excl,tr,amt,viol:r?r.v.length:0};
  });
  const total=ds.reduce((s,d)=>s+d.amt,0);
  return{...f,vig:v.g,base:v.base,ds,total,monthly:total/12,ok:ds.every(d=>d.st==='Verified')};
}
const reqDocs=q=>[['or','Vehicle OR/CR'],['id','Government ID of applicant'],...q.ds.map((d,i)=>['lic'+i,'Driver license: '+d.n])];
async function checkFile(f){
  if(!/^(image\/(jpeg|png)|application\/pdf)$/.test(f.type))return{ok:false,reason:'Use a JPG, PNG or PDF file'};
  if(f.size>5*1048576)return{ok:false,reason:'File is over 5 MB'};
  if(f.type==='application/pdf')return{ok:true};
  try{
    const bm=await createImageBitmap(f);
    if(bm.width<800||bm.height<600)return{ok:false,reason:'Resolution too low (needs at least 800x600)'};
    const c=document.createElement('canvas');c.width=c.height=128;const x=c.getContext('2d');x.drawImage(bm,0,0,128,128);
    const p=x.getImageData(0,0,128,128).data,g=[];for(let i=0;i<p.length;i+=4)g.push(.3*p[i]+.59*p[i+1]+.11*p[i+2]);
    let s=0,s2=0,k=0;for(let y=1;y<127;y++)for(let xx=1;xx<127;xx++){const i=y*128+xx,l=4*g[i]-g[i-1]-g[i+1]-g[i-128]-g[i+128];s+=l;s2+=l*l;k++}
    if(s2/k-(s/k)**2<25)return{ok:false,reason:'Image looks blurry. Retake the photo'};
    return{ok:true};
  }catch{return{ok:false,reason:'File is damaged or unreadable'}}
}

/* ===== Uploaded files: stored as real files in IndexedDB (localStorage is too small) ===== */
const idb=()=>new Promise((ok,no)=>{const r=indexedDB.open('fastlane_files',1);r.onupgradeneeded=()=>r.result.createObjectStore('f');r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)});
const filePut=async(k,b)=>{const d=await idb();return new Promise((ok,no)=>{const t=d.transaction('f','readwrite');t.objectStore('f').put(b,k);t.oncomplete=ok;t.onerror=()=>no(t.error)})};
const fileGet=async k=>{const d=await idb();return new Promise((ok,no)=>{const q=d.transaction('f').objectStore('f').get(k);q.onsuccess=()=>ok(q.result);q.onerror=()=>no(q.error)})};
async function viewDoc(id,k){
  let b;try{b=await fileGet(id+':'+k)}catch{}
  if(!b)return toast('No file is stored for this document. Ask the customer to upload it again.');
  const u=URL.createObjectURL(b),m=document.createElement('div');m.className='modal';m.setAttribute('role','dialog');m.setAttribute('aria-label','Document preview');
  m.innerHTML=`<div class="mbox"><div class="row" style="justify-content:space-between"><b>${esc(b.name||k)}</b><button class="btn sm" id="mc">Close</button></div>${b.type==='application/pdf'?`<iframe src="${u}" title="PDF preview"></iframe>`:`<img src="${u}" alt="Uploaded document">`}</div>`;
  const close=()=>{URL.revokeObjectURL(u);m.remove()};m.onclick=e=>{if(e.target===m)close()};document.body.append(m);m.querySelector('#mc').onclick=close;m.querySelector('#mc').focus();
}

/* ===== Auth ===== */
async function login(e,p){
  const u=db.users.find(x=>x.email===e.trim().toLowerCase());
  if(!u||u.pw!==await sha(p))return toast('Email or password is incorrect.');
  me=u;tab=NAV[u.role][0][0];log('Login');draw();
}
async function register(){
  const n=$('#rn').value.trim(),e=$('#re').value.trim().toLowerCase(),p=$('#rp').value;
  if(!$('#rc').checked)return toast('Tick the data privacy consent first.');
  if(!n||!/^\S+@\S+\.\S+$/.test(e)||p.length<8)return toast('Enter a name, a valid email and a password of 8+ characters.');
  if(db.users.some(x=>x.email===e))return toast('That email is already registered.');
  db.users.push({email:e,name:n,role:'Customer',pw:await sha(p)});save();await login(e,p);
}
const logout=()=>{log('Logout');me=null;draw()};

/* ===== Navigation ===== */
const NAV={Customer:[['quote','Get a quote'],['apps','My applications'],['claims','Claims'],['notifs','Notifications']],
Underwriter:[['uwq','Application queue']],'Claims Officer':[['cq','My claims']],
'Customer Service':[['prof','Customer profiles']],Administrator:[['prof','Customer profiles'],['rep','Reports'],['audit','Audit log'],['lto','Sample LTO data']]};
const go=t=>{tab=t;uwOpen=null;draw()};

/* ===== Views ===== */
function draw(){
  if(!me){$('#root').innerHTML=`<header><div class="brand">FastLane<small>Confidently Fast. Go further. Drive confidently.</small></div></header><main>${loginV()}</main>`;return}
  const nb=NAV[me.role].map(([k,l])=>`<button class="${tab===k?'on':''}" onclick="go('${k}')">${l}</button>`).join('');
  $('#root').innerHTML=`<header><div class="brand">FastLane<small>${esc(me.name)}, ${me.role}</small></div><nav>${nb}<button onclick="logout()">Log out</button></nav></header><main>${VIEWS[tab]()}</main>`;
}
function loginV(){return`<div class="hero"><h1>Insurance that keeps up with your family.</h1><p>Get a quote for up to five drivers in minutes. Each driver is priced on their own verified record, not a flat household average.</p></div>
<div class="g"><div class="card"><h2>Log in</h2><label for="le">Email</label><input id="le" type="email" autocomplete="username"><label for="lp">Password</label><input id="lp" type="password" autocomplete="current-password"><button class="btn" onclick="login($('#le').value,$('#lp').value)">Log in</button>
<p class="muted demo">Demo accounts (password <b>demo1234</b>):<br>${['customer','uw','claims','claims2','csr','admin'].map(x=>`<button class="btn line sm" onclick="login('${x}@demo.ph','demo1234')">${x}</button>`).join('')}</p></div>
<div class="card"><h2>Create a customer account</h2><label for="rn">Full name</label><input id="rn"><label for="re">Email</label><input id="re" type="email"><label for="rp">Password (8+ characters)</label><input id="rp" type="password" autocomplete="new-password">
<label style="font-weight:400"><input id="rc" type="checkbox" style="width:auto"> I consent to FastLane collecting my personal data under the Data Privacy Act of 2012 (RA 10173). This prototype uses sample data only.</label><button class="btn gold" onclick="register()">Create account</button></div></div>`}

function drvRow(i){return`<div class="drv"><div><label>Driver ${i+1} name${i?'':' (primary)'}</label><input class="dn"></div><div><label>Birthdate</label><input class="dd" type="date"></div><div><label>License no.</label><input class="dl" placeholder="N01-23-000001"></div>${i?`<button class="btn line sm" onclick="rows--;this.parentNode.remove()">Remove</button>`:'<span></span>'}</div>`}
function addDrv(){if(rows>=5)return toast('A vehicle can have up to 5 drivers.');$('#drvs').insertAdjacentHTML('beforeend',drvRow(rows++))}
function getQuote(){
  const f={make:$('#vm').value.trim(),model:$('#vo').value.trim(),year:+$('#vy').value,value:+$('#vv').value,city:$('#vc').value,cover:$('#cv').value,manual:$('#lm').value==='manual',
    drivers:[...document.querySelectorAll('.drv')].map(r=>({n:r.querySelector('.dn').value.trim(),d:r.querySelector('.dd').value,l:r.querySelector('.dl').value.trim()}))};
  const er=[];
  if(!f.make||!f.model)er.push('Enter the vehicle make and model.');
  if(!(f.year>=1990&&f.year<=2027))er.push('Vehicle year must be between 1990 and 2027.');
  if(!(f.value>=50000))er.push('Enter the vehicle market value in pesos (at least 50,000).');
  f.drivers.forEach((d,i)=>{if(!d.n||!d.d)er.push(`Driver ${i+1}: enter name and birthdate.`);if(!/^[A-Z]\d{2}-\d{2}-\d{6}$/i.test(d.l))er.push(`Driver ${i+1}: license format is N01-23-000001.`)});
  if(f.city!=='Metro Manila')er.push('Only private passenger vehicles registered in Metro Manila can be insured.');
  if($('#vt').value!=='Private passenger')er.push('Commercial and public utility vehicles are not covered.');
  if(er.length){$('#qerr').innerHTML=er.map(x=>`<div class="b bad" style="display:block;margin:.2rem 0">${esc(x)}</div>`).join('');$('#qres').innerHTML='';return}
  $('#qerr').innerHTML='';lastQuote=calc(f);const q={id:uid('Q'),owner:me.email,date:now(),q:lastQuote};db.quotes.push(q);lastQuote.qid=q.id;save();notify(me.email,'Your quote is ready.');quoteOut();
}
function quoteOut(){
  const q=lastQuote;
  $('#qres').innerHTML=`<div class="card"><h2>Your quote</h2><p class="muted">${esc(q.make)} ${esc(q.model)} ${q.year}, ${q.vig} group, ${q.cover}</p>
  <div class="wrap"><table><tr><th>Driver</th><th>LTO check</th><th>Base share</th><th>Risk loading</th><th>Annual</th></tr>${q.ds.map(d=>`<tr><td>${esc(d.n)}</td><td><span class="b ${d.st==='Verified'?'ok':'bad'}">${d.st}</span>${d.note?`<div class="muted">${esc(d.note)}</div>`:''}</td><td>${peso(d.tr)}</td><td>${d.excl?'Excluded':Math.round(d.load*100)+'%'}</td><td>${peso(d.amt)}</td></tr>`).join('')}</table></div>
  <p><span class="tot">${peso(q.total)}</span> per year, or <b>${peso(q.monthly)}</b> per month</p>
  ${q.ok?'<p class="b ok">All drivers verified. No manual review needed.</p>':'<p class="b warn">Some drivers need an underwriter check. You can still apply and we will resolve it.</p>'}
  <div><button class="btn gold" onclick="applyNow()">Apply now</button> <span class="muted">Change coverage:</span> <button class="btn line sm" onclick="recalc('Comprehensive')">Comprehensive</button><button class="btn line sm" onclick="recalc('Third-Party Liability')">Third-party liability</button></div></div>`;
}
function recalc(c){lastQuote=calc({...lastQuote,cover:c,drivers:lastQuote.drivers});quoteOut()}
function applyNow(){
  const a={id:uid('FL'),owner:me.email,quote:lastQuote,status:'Draft',docs:{},created:now(),resub:false,notes:''};db.apps.push(a);log('Started application '+a.id);go('apps');
}

const BADGE=s=>`<span class="b ${/Active|Approved|Accepted|Verified/.test(s)?'ok':/Declined|Rejected|Retake|Lapsed/.test(s)?'bad':/Hold|Exception|Resubmitted/.test(s)?'warn':''}">${s}</span>`;
function appsV(){
  const mine=db.apps.filter(a=>a.owner===me.email).reverse();
  if(!mine.length)return`<div class="card"><h2>No applications yet</h2><p>Get a quote first, then choose Apply now.</p><button class="btn gold" onclick="go('quote')">Get a quote</button></div>`;
  return mine.map(a=>{
    const q=a.quote,docs=reqDocs(q),all=docs.every(([k])=>a.docs[k]?.state==='Accepted'),editable=['Draft','On Hold'].includes(a.status);
    return`<div class="card"><h2>${a.id} ${BADGE(a.status)}</h2><p class="muted">${esc(q.make)} ${esc(q.model)} ${q.year}, ${peso(q.total)} per year</p>
    ${a.status==='Declined'?`<p>Declined: ${esc(a.notes)}</p>`:''}
    ${editable?`<h3>Required documents</h3>${docs.map(([k,l])=>{const d=a.docs[k];return`<div class="row" style="margin-bottom:.4rem"><div style="flex:1;min-width:200px"><b>${esc(l)}</b> ${d?BADGE(d.state):'<span class="b">Needed</span>'}${d?.reason?`<div class="muted">${esc(d.reason)}</div>`:''}${d?`<div class="muted">${esc(d.name)} <button class="btn line sm" onclick="viewDoc('${a.id}','${k}')">View</button></div>`:''}</div>${!d||d.state!=='Accepted'||a.status==='Draft'?`<input type="file" style="width:auto" aria-label="Upload ${esc(l)}" accept=".jpg,.jpeg,.png,.pdf" onchange="upload('${a.id}','${k}',this.files[0])">`:''}</div>`}).join('')}
    <button class="btn gold" ${all?'':'disabled'} onclick="submitApp('${a.id}')">${a.status==='On Hold'?'Resubmit application':'Submit application'}</button>${all?'':'<span class="muted">Every document must pass the checks first.</span>'}`:''}
    ${['New','Exception','Resubmitted'].includes(a.status)?`<p>Reference <b>${a.id}</b>. ${a.status==='Exception'?'An underwriter is confirming a driver record.':'Your application is in the underwriting queue.'}</p>`:''}
    ${a.status==='Approved'?payV(a):''}${a.status==='Active'?`<p class="b ok">Policy active. See Claims to file a claim.</p>`:''}</div>`}).join('');
}
async function upload(id,k,f){if(!f)return;const a=db.apps.find(x=>x.id===id),r=await checkFile(f);try{await filePut(id+':'+k,f)}catch{}
  a.docs[k]={name:f.name,state:r.ok?'Accepted':'Retake',reason:r.reason||''};save();toast(r.ok?'Document accepted.':r.reason);draw()}
function submitApp(id){const a=db.apps.find(x=>x.id===id),re=a.status==='On Hold';
  a.status=re?'Resubmitted':(a.quote.ok?'New':'Exception');if(re)a.resub=true;a.submitted=a.submitted||now();a.q=now();log('Submitted '+id);notify(me.email,'Application '+id+' received.');save();draw()}
function payV(a){const p=db.policies.find(x=>x.app===a.id);return`<h3>Pay to activate (simulated gateway)</h3><p class="muted">Coverage starts only after payment is confirmed. No real money moves.</p>
<div class="row"><div><label>Method</label><select id="pm${a.id}"><option>GCash</option><option>Maya</option><option>Credit or debit card</option><option>Online bank transfer</option></select></div><div><label>Plan</label><select id="pp${a.id}"><option value="1">Annual ${peso(p.total)}</option><option value="12">First of 12 installments ${peso(p.total/12)}</option></select></div><button class="btn gold" onclick="pay('${a.id}')">Pay now</button></div>`}
let paySid=null;
/* Step 1: Pay now creates a pending payment session and opens the QR page */
function pay(id){const p=db.policies.find(x=>x.app===id),n=+$('#pp'+id).value;
  const s={sid:uid('PS'),app:id,policy:p.no,method:$('#pm'+id).value,plan:n,amount:p.total/n,status:'Pending',created:now()};
  (db.sessions=db.sessions||[]).push(s);paySid=s.sid;log('Started payment '+s.sid);save();go('payqr')}
/* Step 3: gateway confirms. Records the payment and activates the policy (coverage starts only here) */
function completePayment(sid){
  const s=(db.sessions||[]).find(x=>x.sid===sid);if(!s||s.status!=='Pending')return null;
  const a=db.apps.find(x=>x.id===s.app),p=db.policies.find(x=>x.no===s.policy),e=new Date(),pay={id:uid('PAY'),policy:p.no,amount:s.amount,method:s.method,date:now()};
  db.payments.push(pay);p.status='Active';p.start=now();e.setFullYear(e.getFullYear()+1);p.end=e.toISOString();a.status='Active';a.activated=now();
  s.status='Paid';s.payId=pay.id;s.paid=pay.date;log('Payment confirmed '+p.no);notify(a.owner,'Payment confirmed. Policy '+p.no+' is active.');save();return s}
const payUrl=s=>location.href.split('#')[0]+'#pay='+encodeURIComponent(btoa(JSON.stringify({sid:s.sid,ref:s.app,amt:s.amount,m:s.method})));
const shell=h=>$('#root').innerHTML=`<header><div class="brand">FastLane<small>Confidently Fast. Go further. Drive confidently.</small></div></header><main>${h}</main>`;
/* Step 2a: QR page */
function payqrV(){
  const s=(db.sessions||[]).find(x=>x.sid===paySid);if(!s)return'<div class="card"><p>No payment in progress.</p><button class="btn" onclick="go(\'apps\')">Back to applications</button></div>';
  setTimeout(()=>{const el=$('#qr');if(!el)return;if(window.QRCode)new QRCode(el,{text:payUrl(s),width:210,height:210,correctLevel:QRCode.CorrectLevel.M});else el.textContent='The QR library could not load. Use the Open payment page button.'},0);
  return`<div class="card" style="max-width:440px;margin:1rem auto;text-align:center"><h2>Scan to pay with ${esc(s.method)}</h2><p class="tot">${peso(s.amount)}</p><p class="muted">Application ${esc(s.app)}${s.plan>1?', first of 12 installments':', annual premium'}</p>
  <div id="qr" style="display:flex;justify-content:center;margin:1rem 0;min-height:210px"></div>
  <p class="muted">Scan this code with your phone camera. This page moves on by itself once the payment goes through.</p>
  <button class="btn gold" onclick="tab='paygw';draw()">Open payment page (simulate scan)</button><button class="btn line" onclick="go('apps')">Cancel</button>
  <p class="muted">Demo note: a real phone is a separate browser and cannot update this one. To follow the full flow, use the Open payment page button.</p></div>`}
/* Step 2b: gateway page (opened from the QR) */
const gwHTML=(s,sa)=>`<div class="card" style="max-width:380px;margin:1rem auto;text-align:center"><div class="muted">Simulated ${esc(s.method)} checkout, sandbox mode</div><h2>Confidently Fast</h2><div class="tot">${peso(s.amount)}</div><p class="muted">Reference ${esc(s.app)}<br>No real money moves.</p><button class="btn gold" id="gp" style="width:100%" onclick="confirmPay('${s.sid}',${sa?1:0})">Pay ${peso(s.amount)}</button>${sa?'':'<button class="btn line" style="width:100%" onclick="tab=\'payqr\';draw()">Cancel</button>'}</div>`;
function paygwV(){const s=(db.sessions||[]).find(x=>x.sid===paySid);return s&&s.status==='Pending'?gwHTML(s,0):'<div class="card"><p>This payment is no longer pending.</p><button class="btn" onclick="go(\'apps\')">Back to applications</button></div>'}
function confirmPay(sid,sa){
  const b=$('#gp');b.disabled=true;b.textContent='Processing payment...';
  setTimeout(()=>{const s=completePayment(sid);
    if(sa){const d=JSON.parse(atob(decodeURIComponent(location.hash.slice(5))));shell(doneHTML(s||{app:d.ref,amount:d.amt,method:d.m,paid:now()},null,null,1,!s))}
    else{tab='paydone';draw()}},1200)}
/* Step 4: success page */
function doneHTML(s,pol,rc,sa,unsynced){
  const R=[['Receipt no.',rc?.id],['Amount paid',peso(s.amount)],['Method',s.method+(s.plan>1?' (first of 12 installments)':'')],['Application',s.app],['Policy no.',pol?.no],['Coverage period',pol?.start?when(pol.start)+' to '+when(pol.end):''],['Paid on',when(s.paid)]].filter(r=>r[1]);
  return`<div class="card" style="max-width:480px;margin:1rem auto;text-align:center"><div style="font:800 3rem Archivo;color:var(--ok)" aria-hidden="true">&#10003;</div><h1 style="font-style:normal;font-size:1.8rem">Payment successful</h1><p>Thank you. We received your payment${pol?' and your policy is now active.':'.'}</p>
  <table style="text-align:left">${R.map(r=>`<tr><th>${r[0]}</th><td>${esc(r[1])}</td></tr>`).join('')}</table>
  ${unsynced?'<p class="muted">Demo note: this device is a separate browser from the portal, so the policy was not activated there. Use the Open payment page button in the portal to complete the flow.</p>':''}
  ${sa?'':`<button class="btn gold" onclick="go('apps')">View my applications</button><button class="btn line" onclick="go('claims')">File a claim</button>`}</div>`}
function paydoneV(){const s=(db.sessions||[]).find(x=>x.sid===paySid);if(!s||s.status!=='Paid')return'<div class="card"><p>No completed payment to show.</p><button class="btn" onclick="go(\'apps\')">Back to applications</button></div>';
  return doneHTML(s,db.policies.find(x=>x.no===s.policy),db.payments.find(x=>x.id===s.payId))}
/* If the payment is completed in another tab of this browser, move this page on automatically */
addEventListener('storage',e=>{if(e.key!==K||tab!=='payqr'||!me||!e.newValue)return;db=JSON.parse(e.newValue);const s=(db.sessions||[]).find(x=>x.sid===paySid);if(s?.status==='Paid'){tab='paydone';draw()}});
/* Opening the QR link on another device or tab lands on the gateway page without a login */
function standalone(){try{const d=JSON.parse(atob(decodeURIComponent(location.hash.slice(5))));shell(gwHTML({sid:d.sid,app:d.ref,amount:d.amt,method:d.m},1))}catch{draw()}}

function uwqV(){
  if(uwOpen)return reviewV(db.apps.find(a=>a.id===uwOpen));
  const f=$('#uf')?.value||'All',L=db.apps.filter(a=>['New','Exception','On Hold','Resubmitted'].includes(a.status)&&(f==='All'||a.status===f))
   .sort((a,b)=>(b.status==='Resubmitted')-(a.status==='Resubmitted')||new Date(a.q)-new Date(b.q));
  return`<div class="card"><h2>Application queue</h2><label for="uf">Status filter</label><select id="uf" style="width:auto" onchange="draw();$('#uf').value=this.value"><option>All</option>${['New','Exception','On Hold','Resubmitted'].map(s=>`<option ${s===f?'selected':''}>${s}</option>`).join('')}</select>
  <div class="wrap"><table><tr><th>Ref</th><th>Vehicle</th><th>Drivers</th><th>Status</th><th>Submitted</th><th></th></tr>${L.map(a=>`<tr><td>${a.id}</td><td>${esc(a.quote.make)} ${esc(a.quote.model)}</td><td>${a.quote.ds.length}</td><td>${BADGE(a.status)}</td><td>${when(a.q)}</td><td><button class="btn sm" onclick="uwOpen='${a.id}';draw()">Review</button></td></tr>`).join('')||'<tr><td colspan="6">The queue is empty.</td></tr>'}</table></div></div>`}
function reviewV(a){const q=a.quote;return`<button class="btn line sm" onclick="uwOpen=null;draw()">Back to queue</button><div class="card"><h2>${a.id} ${BADGE(a.status)}</h2><p>${esc(q.make)} ${esc(q.model)} ${q.year}, ${peso(q.value)}, ${q.vig} group, ${q.cover}. Owner: ${esc(a.owner)}</p>
<h3>Driver records (simulated LTO)</h3><div class="wrap"><table><tr><th>Declared</th><th>License</th><th>Result</th><th>LTO violations</th></tr>${q.ds.map(d=>{const r=ltoFind(d.l);return`<tr><td>${esc(d.n)}<br><span class="muted">${esc(d.d)}</span></td><td>${esc(d.l)}</td><td>${BADGE(d.st)}${d.note?`<div class="muted">${esc(d.note)}</div>`:''}${r?`<div class="muted">LTO: ${esc(r.n)}, ${r.d}, ${r.s}</div>`:''}</td><td>${r?r.v.map(v=>`${esc(v.c)} (${v.sev}, ${v.dt})`).join('<br>')||'None':'-'}</td></tr>`}).join('')}</table></div>
${a.status==='Exception'?`<button class="btn gold" onclick="resolveEx('${a.id}')">Confirm driver records</button>`:''}
<h3>Documents</h3>${reqDocs(q).map(([k,l])=>{const d=a.docs[k];return`<div class="row" style="margin-bottom:.3rem"><div style="flex:1"><b>${esc(l)}</b> ${d?BADGE(d.state):''} <span class="muted">${esc(d?.name||'')}</span> ${d?`<button class="btn line sm" onclick="viewDoc('${a.id}','${k}')">View</button>`:''}</div><select id="rr${k}" style="width:auto">${REASONS.map(r=>`<option>${r}</option>`).join('')}</select><button class="btn line sm" onclick="rejDoc('${a.id}','${k}')">Reject document</button></div>`}).join('')}
<h3>Decision</h3><button class="btn" onclick="decide('${a.id}','Approved')">Approve</button><button class="btn line" onclick="decide('${a.id}','On Hold')">Hold</button><button class="btn line" onclick="decide('${a.id}','Declined')">Decline</button></div>`}
function resolveEx(id){const a=db.apps.find(x=>x.id===id);
  /* manual double-check done: build records for licenses the LTO had no data on, then reprice */
  a.quote.drivers.forEach(d=>{if(!ltoFind(d.l))ltoEnsure(d)});a.quote=calc({...a.quote,manual:false});
  a.status='New';log('Resolved exception '+id);save();toast('Driver records confirmed. Quote repriced from the checked records.');draw()}
function rejDoc(id,k){const a=db.apps.find(x=>x.id===id),r=$('#rr'+k).value;a.docs[k].state='Rejected';a.docs[k].reason=r;a.status='On Hold';log(`Rejected ${k} on ${id}: ${r}`);notify(a.owner,`A document on ${id} was rejected: ${r}. Re-upload only that file.`);save();uwOpen=null;draw()}
function decide(id,s){const a=db.apps.find(x=>x.id===id);
  if(s==='Approved'){if(a.status==='Exception')return toast('Confirm the driver records before approving.');if(Object.values(a.docs).some(d=>d.state!=='Accepted'))return toast('A rejected document is still open.');
    db.policies.push({no:uid('POL'),app:id,owner:a.owner,status:'Pending',total:a.quote.total,vehicle:a.quote.make+' '+a.quote.model,cover:a.quote.cover})}
  if(s==='Declined'){const r=prompt('Reason for declining?');if(!r)return;a.notes=r}
  a.status=s;a.decided=now();log(`${s} ${id}`);notify(a.owner,`Application ${id}: ${s}.`+(s==='Approved'?' Pay to activate your policy.':''));save();uwOpen=null;draw()}

/* Claims */
const claimLate=c=>{const sla=c.stage===0?24:72;return c.stage<6&&hrs(c.t,now())>sla};
function claimsV(){
  const ps=db.policies.filter(p=>p.owner===me.email&&p.status==='Active'),mine=db.claims.filter(c=>c.owner===me.email).reverse();
  return`<div class="card"><h2>File a claim</h2>${ps.length?`<div class="g"><div><label>Policy</label><select id="cp">${ps.map(p=>`<option value="${p.no}">${p.no} ${esc(p.vehicle)}</option>`).join('')}</select></div><div><label>Incident date and time</label><input id="ci" type="datetime-local"></div><div><label>Location</label><input id="cl"></div><div><label>Estimated damage (₱)</label><input id="cd" type="number"></div></div>
  <label>What happened</label><textarea id="cx" rows="2"></textarea><label>Third party details (optional)</label><input id="ct"><button class="btn gold" onclick="fileClaim()">File claim</button>`:'<p>You need an active policy to file a claim.</p>'}</div>${mine.map(claimCard).join('')}`}
function claimCard(c){return`<div class="card"><h3>${c.id} <span class="muted">${c.policy}</span> ${c.flag?`<span class="b warn">${c.flag}</span>`:''} ${claimLate(c)?'<span class="b bad">Overdue</span>':''}</h3>
<div class="track">${STAGES.map((s,i)=>`<span class="${i<c.stage?'d':i===c.stage?'c':''}">${s}${c.hist[i]?`<br>${when(c.hist[i])}`:''}</span>`).join('')}</div>
<p class="muted">Officer: ${esc(c.officer)}${c.shop?` | Repair shop: ${esc(c.shop)}`:''}${c.est?` | Estimate ${peso(c.est)}`:''}${c.inspect?' | Inspection required':''}</p>
${me.role==='Customer'&&c.stage===4?`<p>Settlement offer: <b>${peso(c.settle)}</b> ${c.method}</p><button class="btn gold" onclick="adv('${c.id}')">Accept offer</button>`:''}
${me.role==='Claims Officer'&&c.stage!==4&&c.stage<6?`<button class="btn" onclick="adv('${c.id}')">Move to: ${STAGES[c.stage+1]}</button>`:''}</div>`}
function fileClaim(){
  const inc=$('#ci').value,desc=$('#cx').value.trim(),est=+$('#cd').value;
  if(!inc||!$('#cl').value.trim()||!desc)return toast('Enter the incident time, location and description.');
  if(new Date(inc)>new Date())return toast('Incident time cannot be in the future.');
  const h=hrs(inc,now());let flag='',late='';
  if(h>72){late=prompt('This claim is over 72 hours late. Give the reason for the delay:');if(!late)return;flag='Filed late: reason required'}else if(h>48)flag='Filed after 48 hours';
  const off=db.users.filter(u=>u.role==='Claims Officer').map(u=>({u,n:db.claims.filter(c=>c.officer===u.name&&c.stage<6).length})).sort((a,b)=>a.n-b.n)[0].u.name,p=db.policies.find(x=>x.no===$('#cp').value);
  const c={id:uid('CL'),policy:p.no,owner:me.email,inc,loc:$('#cl').value,desc,tp:$('#ct').value,late,flag,stage:0,hist:[now()],t:now(),officer:off,est:est||0,inspect:p.cover==='Comprehensive'&&est>10000,method:'Direct payment to repair shop'};
  db.claims.push(c);log('Filed claim '+c.id);notify(me.email,`Claim ${c.id} filed and assigned to ${off}.`);save();draw();
}
function adv(id){const c=db.claims.find(x=>x.id===id);
  if(c.stage===1){const s=prompt('Select repair shop:\n'+db.shops.map((x,i)=>`${i+1}. ${x}`).join('\n')+'\nEnter number:');if(!s||!db.shops[s-1])return;c.shop=db.shops[s-1]}
  if(c.stage===2){const e=+prompt('Repair estimate in pesos:',c.est||'');if(!(e>0))return;c.est=e;const rep=confirm('Is the damage repairable?\nOK = repairable (pay shop). Cancel = not repairable (cash settlement).');c.method=rep?'Direct payment to repair shop':'Cash settlement';c.settle=e}
  c.stage++;c.hist[c.stage]=now();c.t=now();log(`Claim ${id} to ${STAGES[c.stage]}`);notify(c.owner,`Claim ${id} is now: ${STAGES[c.stage]}.`);save();draw()}
function cqV(){const L=db.claims.filter(c=>c.officer===me.name).reverse();return`<div class="card"><h2>My claims</h2><p class="muted">Claims turn red when a stage passes its timer: 24 hours to acknowledge, 72 hours for later stages.</p></div>${L.map(claimCard).join('')||'<div class="card">No claims assigned.</div>'}`}

function notifsV(){const L=db.notifs.filter(n=>n.to===me.email);return`<div class="card"><h2>Notifications</h2>${L.map(n=>`<p><span class="muted">${when(n.t)}</span><br>${esc(n.m)}</p>`).join('')||'<p>Nothing yet.</p>'}</div>`}
function profV(){const s=($('#ps')?.value||'').toLowerCase();let out='';
  if(s){const as=db.apps.filter(a=>(a.id+a.owner+a.quote.ds.map(d=>d.n).join()).toLowerCase().includes(s)),owners=[...new Set(as.map(a=>a.owner).concat(db.users.filter(u=>(u.email+u.name).toLowerCase().includes(s)&&u.role==='Customer').map(u=>u.email)))];
   out=owners.map(o=>`<div class="card"><h3>${esc(o)}</h3><b>Applications</b><br>${db.apps.filter(a=>a.owner===o).map(a=>`${a.id} ${BADGE(a.status)} ${esc(a.quote.make)} ${esc(a.quote.model)}`).join('<br>')||'None'}<br><b>Policies</b><br>${db.policies.filter(p=>p.owner===o).map(p=>`${p.no} ${BADGE(p.status)} ${peso(p.total)}`).join('<br>')||'None'}<br><b>Payments</b><br>${db.payments.filter(p=>db.policies.some(x=>x.no===p.policy&&x.owner===o)).map(p=>`${peso(p.amount)} via ${p.method}, ${when(p.date)}`).join('<br>')||'None'}<br><b>Claims</b><br>${db.claims.filter(c=>c.owner===o).map(c=>`${c.id}: ${STAGES[c.stage]}`).join('<br>')||'None'}</div>`).join('')||'<div class="card">No match found.</div>'}
  return`<div class="card"><h2>Customer profiles</h2><label for="ps">Search by name, email or reference number</label><div class="row"><input id="ps" style="max-width:380px" value="${esc(s)}" onkeydown="if(event.key==='Enter')draw()"><button class="btn" onclick="draw()">Search</button></div></div>${out}`}
function repV(){const ap=db.apps.filter(a=>a.submitted),dec=ap.filter(a=>a.decided),cl=db.claims.filter(c=>c.stage===6);
  const avg=a=>a.length?(a.reduce((s,x)=>s+x,0)/a.length).toFixed(1):'n/a';
  const rows=[['Applications submitted',ap.length],['Average underwriting turnaround (hours)',avg(dec.map(a=>hrs(a.submitted,a.decided)))],['Document resubmission rate',ap.length?Math.round(ap.filter(a=>a.resub).length/ap.length*100)+'%':'n/a'],['Quote to policy conversion',db.quotes.length?Math.round(db.apps.filter(a=>a.status==='Active').length/db.quotes.length*100)+'%':'n/a'],['Average claim settlement time (hours)',avg(cl.map(c=>hrs(c.hist[0],c.hist[6])))],['Open claims',db.claims.filter(c=>c.stage<6).length],['Overdue claims',db.claims.filter(claimLate).length]];
  return`<div class="card"><h2>Management report</h2><table>${rows.map(r=>`<tr><td>${r[0]}</td><td><b>${r[1]}</b></td></tr>`).join('')}</table><button class="btn" onclick="csv()">Export CSV</button><button class="btn line" onclick="if(confirm('Delete all sample data and reset?')){localStorage.removeItem(K);indexedDB.deleteDatabase('fastlane_files');location.reload()}">Reset sample data</button></div>`}
function csv(){const rs=[['Application','Owner','Status','Submitted','Decided'],...db.apps.map(a=>[a.id,a.owner,a.status,a.submitted||'',a.decided||''])];const b=new Blob([rs.map(r=>r.join(',')).join('\n')],{type:'text/csv'}),l=document.createElement('a');l.href=URL.createObjectURL(b);l.download='fastlane-report.csv';l.click()}
const auditV=()=>`<div class="card"><h2>Audit log</h2><div class="wrap"><table><tr><th>When</th><th>User</th><th>Action</th></tr>${db.audit.slice(0,200).map(a=>`<tr><td>${when(a.t)}</td><td>${esc(a.u)}</td><td>${esc(a.a)}</td></tr>`).join('')}</table></div></div>`;
const ltoV=()=>`<div class="card"><h2>Sample LTO records (fictitious)</h2><div class="wrap"><table><tr><th>License</th><th>Name</th><th>Birthdate</th><th>Status</th><th>Violations</th></tr>${db.lto.map(r=>`<tr><td>${r.l}</td><td>${r.n}${r.gen?' <span class="muted">(auto-generated)</span>':''}</td><td>${r.d}</td><td>${BADGE(r.s==='Valid'?'Verified':r.s)}</td><td>${r.v.map(v=>`${v.c} (${v.sev}, ${v.dt})`).join('<br>')||'None'}</td></tr>`).join('')}</table></div></div>`;
const quoteV=()=>{rows=1;return`<div class="hero"><h1>Get a quote in minutes.</h1><p>Enter your vehicle and up to five drivers. Try the sample licenses in the admin tab, for example N01-23-000001 (Juan Dela Cruz, 1990-05-14).</p></div>
<div class="card"><h2>Vehicle</h2><div class="g"><div><label>Make</label><input id="vm"></div><div><label>Model</label><input id="vo"></div><div><label>Year</label><input id="vy" type="number"></div><div><label>Market value (₱)</label><input id="vv" type="number"></div><div><label>Registered in</label><select id="vc"><option>Metro Manila</option><option>Outside Metro Manila</option></select></div><div><label>Vehicle type</label><select id="vt"><option>Private passenger</option><option>Commercial</option><option>Public utility</option></select></div><div><label>Unknown license numbers</label><select id="lm"><option value="auto">Auto-generate a background</option><option value="manual">Send to manual review</option></select></div><div><label>Coverage</label><select id="cv"><option>Comprehensive</option><option>Third-Party Liability</option></select></div></div>
<h2 style="margin-top:1rem">Drivers</h2><div id="drvs">${drvRow(0)}</div><button class="btn line sm" onclick="addDrv()">Add driver</button><div id="qerr"></div><button class="btn gold" onclick="getQuote()">Get quote</button></div><div id="qres"></div>`};
const VIEWS={payqr:payqrV,paygw:paygwV,paydone:paydoneV,quote:quoteV,apps:appsV,claims:claimsV,notifs:notifsV,uwq:uwqV,cq:cqV,prof:profV,rep:repV,audit:auditV,lto:ltoV};
boot().then(()=>location.hash.startsWith('#pay=')?standalone():draw());
</script>
